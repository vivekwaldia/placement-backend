spring.application.name=placement-backend

# Connect Java to the database, create placement_db if it doesn't exist
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/placement_db?createDatabaseIfNotExist=true}

spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:your_local_password}

# Tells Spring to automatically create MySQL files based on our Java classes
spring.jpa.hibernate.ddl-auto=update

# Show the SQL queries running in the console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}